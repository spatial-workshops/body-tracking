name: Build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build app bundle
        run: ./scripts/build-app.sh

      - name: Detection smoke test
        run: |
          curl -fsSL -o bus.jpg https://github.com/ultralytics/assets/releases/download/v0.0.0/bus.jpg
          BIN=build/BodyTracking.app/Contents/MacOS/BodyTracking
          "$BIN" --detect bus.jpg --format yolo --model yolo26n-pose > yolo26.json
          "$BIN" --detect bus.jpg --format mediapipe --model yolo26n-pose > mediapipe.json
          "$BIN" --detect bus.jpg --model yolo26n-pose --canvas 1280x720 > hands.json
          "$BIN" --detect bus.jpg --model yolo26n-pose --canvas 1280x720 --flip > hands-flipped.json
          "$BIN" --detect bus.jpg --model https://github.com/ultralytics/yolo-ios-app/releases/download/v8.3.0/yolo11n-pose.mlpackage.zip --format yolo > yolo11.json
          python3 scripts/check-detection.py yolo26.json yolo11.json
          python3 scripts/check-mediapipe.py yolo26.json mediapipe.json
          python3 scripts/check-hands.py mediapipe.json hands.json hands-flipped.json 1280 720

      - uses: actions/upload-artifact@v4
        with:
          name: BodyTracking-unsigned
          path: build/BodyTracking.app
          retention-days: 7
